name: Build StarTok Ultimate IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Direct URL to decrypted TikTok .ipa'
        required: true
        default: 'https://github.com/swaggyP36000/TrollStore-IPAs/releases/download/08-31-2024/TikTokDark-36.2.0.ipa'
      target_region:
        description: 'Default Region Code (US, BY, KZ, DE, JP)'
        required: true
        default: 'US'
      backend_url:
        description: 'StarTok Backend URL'
        required: false
        default: 'https://api.startok.app'

jobs:
  build-and-inject:
    runs-on: macos-14
    steps:
      - name: Checkout StarTok Repository
        uses: actions/checkout@v4

      - name: Setup Theos Environment & iOS SDKs
        run: |
          echo "Installing system dependencies..."
          brew install ldid dpkg
          
          # Install insert_dylib
          echo "Building insert_dylib..."
          git clone https://github.com/tyilo/insert_dylib.git /tmp/insert_dylib
          cd /tmp/insert_dylib
          xcodebuild -configuration Release
          sudo cp build/Release/insert_dylib /usr/local/bin/ || sudo cp build/Release/insert_dylib /opt/homebrew/bin/ || true
          cd $GITHUB_WORKSPACE
          
          export THEOS=/tmp/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          
          echo "Installing iOS SDK..."
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          mv sdks-master/*.sdk $THEOS/sdks/ || true
          rm -rf master.zip sdks-master

      - name: Configure Backend & Region in Source Code
        run: |
          BACKEND="${{ github.event.inputs.backend_url }}"
          REGION="${{ github.event.inputs.target_region }}"
          
          echo "Setting custom backend: $BACKEND"
          sed -i '' "s|https://api.startok.app|$BACKEND|g" StarTok.h
          
          echo "Setting default region: $REGION"
          sed -i '' "s|@\"US\"|@\"$REGION\"|g" StarTokManager.m

      - name: Compile StarTok Tweak (Theos)
        run: |
          export THEOS=/tmp/theos
          make clean
          make package FINALPACKAGE=1
          echo "Checking compiled dylib:"
          find .theos -name "StarTok.dylib"

      - name: Download Target TikTok IPA
        run: |
          IPA_URL="${{ github.event.inputs.ipa_url }}"
          echo "Downloading TikTok IPA from $IPA_URL..."
          curl -L "$IPA_URL" -o ./base.ipa
          
          if [ ! -f ./base.ipa ] || [ $(wc -c < ./base.ipa) -lt 1000000 ]; then
            echo "Error: Failed to download valid .ipa file!"
            exit 1
          fi

      - name: Inject StarTok Tweak into Mach-O Binary
        run: |
          echo "Extracting IPA..."
          unzip -q ./base.ipa -d ./extracted
          
          APP_DIR=$(find ./extracted/Payload -name "*.app" | head -n 1)
          APP_NAME=$(basename "$APP_DIR")
          APP_BINARY="${APP_DIR}/${APP_NAME%.app}"
          
          echo "App directory: $APP_DIR"
          echo "App binary: $APP_BINARY"
          
          DYLIB_SRC=$(find .theos -name "StarTok.dylib" | head -n 1)
          echo "Found compiled dylib at: $DYLIB_SRC"
          
          # Create Frameworks directory if not exists
          mkdir -p "${APP_DIR}/Frameworks"
          
          # Copy StarTok.dylib
          cp "$DYLIB_SRC" "${APP_DIR}/Frameworks/StarTok.dylib"
          
          # Copy CydiaSubstrate if present in Theos
          SUBSTRATE="/tmp/theos/vendor/lib/CydiaSubstrate.framework/CydiaSubstrate"
          if [ -f "$SUBSTRATE" ]; then
            cp "$SUBSTRATE" "${APP_DIR}/Frameworks/CydiaSubstrate.dylib"
            install_name_tool -id "@rpath/CydiaSubstrate.dylib" "${APP_DIR}/Frameworks/CydiaSubstrate.dylib" || true
            install_name_tool -change "/Library/Frameworks/CydiaSubstrate.framework/CydiaSubstrate" "@rpath/CydiaSubstrate.dylib" "${APP_DIR}/Frameworks/StarTok.dylib" || true
            insert_dylib --inplace --all-yes "@rpath/CydiaSubstrate.dylib" "$APP_BINARY" || true
          fi
          
          # Fix dylib id and inject into Mach-O binary
          install_name_tool -id "@rpath/StarTok.dylib" "${APP_DIR}/Frameworks/StarTok.dylib" || true
          insert_dylib --inplace --all-yes "@rpath/StarTok.dylib" "$APP_BINARY"
          
          # Codesign with ldid
          ldid -S "${APP_DIR}/Frameworks/StarTok.dylib" || true
          ldid -S "$APP_BINARY" || true
          
          # Repackage IPA
          cd ./extracted
          zip -qr ../StarTok_Ultimate_${{ github.event.inputs.target_region }}.ipa Payload
          cd ..
          
          echo "Successfully created StarTok IPA!"

      - name: Verify IPA Integrity
        run: |
          echo "Verifying generated StarTok IPA..."
          ls -lh ./StarTok_Ultimate_*.ipa
          unzip -l ./StarTok_Ultimate_*.ipa | grep -i "StarTok.dylib"

      - name: Upload StarTok IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarTok_Ultimate_${{ github.event.inputs.target_region }}
          path: ./StarTok_Ultimate_*.ipa
          retention-days: 14
